#---------------------------
# Hexo Theme Fluid Configuration
# Documentation: https://hexo.fluid-dev.com/docs/guide/
#---------------------------

# 导航栏配置
navbar:
  blog_title: "ZhangBaiCheng's Blog"
  ground_glass:
    enable: true
    px: 5
    alpha: 0.8
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 暗色模式
dark_mode:
  enable: true
  default: auto

# 代码块与高亮增强
code:
  copy_btn: true
  language:
    enable: true
    default: "TEXT"
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: "github gist"
      style_dark: "dark"

# 动态打字机副标题
fun_features:
  typing:
    enable: true
    typeSpeed: 70
    cursorChar: "_"
    loop: false

# 网站访问统计 (百度统计)
web_analytics:
  enable: true
  follow_dnt: true
  baidu: 265d38f768179f112448ec05adca1224

# 本地搜索（兼容已配置的 search.xml）
search:
  enable: true
  path: /search.xml
  generate_path: /search.xml
  field: post
  content: true

# 首页配置
index:
  slogan:
    enable: true

# 个人关于页
about:
  enable: true
  avatar: /images/avatar.jpg
  name: "百成"
  intro: "Sharp tools make good work"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/zbcio", tip: "GitHub" }

# 页脚配置
footer:
  content: '
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener"><span>Hexo</span></a>
    <i class="iconfont icon-love"></i>
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener"><span>Fluid</span></a>
  '
  statistics:
    enable: true
    source: "busuanzi"
